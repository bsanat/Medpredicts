name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "ml-ai/artifacts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "ml-ai/artifacts/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tests including Python-Java parity on the ml-ai bundle
        run: sh mvnw -B test -Dmedpredict.model.test-directory="$GITHUB_WORKSPACE/ml-ai/artifacts"
