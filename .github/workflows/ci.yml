name: backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fetch published ML bundle
        uses: actions/checkout@v4
        with:
          repository: MedPredicts/ml-ai
          path: ml-ai
      - name: Tests (with real bundle parity when available)
        run: |
          if [ -f ml-ai/artifacts/model.onnx ]; then
            sh mvnw -B test -Dmedpredict.model.test-directory="$GITHUB_WORKSPACE/ml-ai/artifacts"
          else
            echo "ml-ai bundle not published on main yet; running without real-bundle tests"
            sh mvnw -B test
          fi
