# Optional local secrets file (git-ignored), KEY=value lines; real environment variables take precedence.
spring.config.import=optional:file:${MEDPREDICT_ENV_FILE:.env}[.properties]
spring.application.name=medpredict-backend
application.default-locale=${DEFAULT_LOCALE:ru}
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
springdoc.paths-to-match=/api/v1/**
springdoc.override-with-generic-response=false
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
server.port=${PORT:8080}
medpredict.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.parser.strict-duplicate-detection=true
medpredict.model.directory=${MEDPREDICT_MODEL_DIRECTORY:./model}
medpredict.model.expected-version=${MEDPREDICT_MODEL_VERSION:}
medpredict.assistant.gemini.api-key=${GEMINI_API_KEY:}
medpredict.assistant.gemini.models=${GEMINI_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite}
medpredict.assistant.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
medpredict.assistant.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
medpredict.assistant.gemini.max-output-tokens=4096
medpredict.assistant.gemini.thinking-level=${GEMINI_THINKING_LEVEL:low}
medpredict.assistant.requests-per-minute=${ASSISTANT_REQUESTS_PER_MINUTE:20}
